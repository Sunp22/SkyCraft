# Builds SkyCraft on GitHub's Windows machines and uploads the Vortex/MO2 mod zip.
#
# Put this file in your repo as .github/workflows/build.yml. If SkyCraft-Patch.patch (control mode
# is already in the source; the patch adds world reset, show world, mobs, mob roaming, roaming on rough
# ground, chat input, mob life, mob combat, mob polish and mob hit effects, stand-in cleanup, no mobs in settlements, lock-on on the mob's body, stand-in damage guard and 1:1 stand-in health, and a body-width block collision for Skyrim mode) is in the root of the repo, it is applied
# before building, and skipped if the source already has it.
# A second job ("tdm-patch") builds True Directional Movement from its own source with
# TrueDirectionalMovement-VirtualTargets.patch (also in the root of the repo) applied, so TDM can lock on to Minecraft's mobs, and
# uploads it as its own optional zip: TrueDirectionalMovement.dll for SKSE\\Plugins, to be installed over TDM's, the way TDM's
# Improved Camera patch is. SkyCraft works without it (lock-on then goes by the stand-ins' actors). If the patch isn't in the repo
# the job does nothing.
# Run it from the repo's Actions tab ("Build SkyCraft" -> Run workflow), or it runs on every push.
#
# The first run takes a long time (vcpkg compiles the C++ dependencies, Gradle fetches Minecraft);
# later runs reuse caches and are much faster.

name: Build SkyCraft

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # The project's CMake preset needs the "Visual Studio 18 2026" generator. windows-2025 has had
    # Visual Studio 2026 since June 2026. If a future image drops it, try windows-2025-vs2026.
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      VCPKG_DISABLE_METRICS: "1"

    steps:
      # Before checkout, so files keep the line endings they have in the repo.
      - name: Keep line endings as they are in the repo
        run: git config --global core.autocrlf false

      - name: Check out the source (with the CommonLibSSE-NG submodule, if the repo has it)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply SkyCraft-Patch.patch (world reset, show world, mobs, mob roaming, roaming on rough ground, chat input, mob life, mob combat and mob polish) if it is in the repo
        shell: bash
        run: |
          # The docs aren't part of the build, so a change upstream there must not stop it.
          opts=(--exclude=README.md '--exclude=docs/*')
          # A patch whose setting name is already in the source has been applied (or committed): skip
          # it. (Checking by reversing the patch doesn't work once a later patch has changed the same lines.)
          apply_patch() {
            local patch=$1 marker=$2 file=$3
            if [ ! -f "$patch" ]; then
              echo "No $patch in the repo; skipping it."
            elif grep -q "$marker" "$file"; then
              echo "The source already has what $patch adds; nothing to apply."
            elif git apply "${opts[@]}" --check "$patch"; then
              git apply "${opts[@]}" "$patch"
              echo "Applied $patch."
            else
              echo "::error::$patch doesn't apply to this source. The repo has probably changed since the patch was made."
              exit 1
            fi
          }
          apply_patch SkyCraft-Patch.patch jumpLatch skse/src/NpcBlocks.cpp

      # A repo made from "Download ZIP" has no submodule contents. Fetch CommonLibSSE-NG ourselves
      # then (the branch's latest commit, not the exact one the author built with).
      - name: Make sure CommonLibSSE-NG is there
        shell: bash
        run: |
          dir=skse/extern/CommonLibSSE-NG
          if [ -f "$dir/CMakeLists.txt" ]; then
            echo "CommonLibSSE-NG came with the checkout."
          else
            echo "CommonLibSSE-NG is missing; cloning the ng branch."
            rm -rf "$dir"
            git clone --recursive --branch ng https://github.com/alandtse/CommonLibVR.git "$dir"
          fi

      - name: Set up JDK 25 (Minecraft 26.x needs it)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Create the vcpkg cache folder
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore the vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('skse/vcpkg.json', 'skse/CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('skse/vcpkg.json', 'skse/CMakePresets.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fabric/gradle.properties', 'fabric/build.gradle', 'fabric/settings.gradle', 'fabric/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('fabric/gradle.properties', 'fabric/build.gradle', 'fabric/settings.gradle', 'fabric/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-

      # The CMake preset looks for vcpkg in .tools/vcpkg (the README's "Building from source").
      # Bootstrapping downloads vcpkg.exe from GitHub's releases, which now and then answers 502 for a
      # minute or two. Both network steps are retried, waiting a little longer each time.
      - name: Get vcpkg
        run: |
          function Retry([string]$what, [scriptblock]$action) {
            for ($i = 1; $i -le 5; $i++) {
              & $action
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "$what failed (attempt $i of 5)."
              if ($i -lt 5) { Start-Sleep -Seconds (20 * $i) }
            }
            throw "$what failed 5 times"
          }
          Retry "Cloning vcpkg" {
            if (Test-Path .tools\vcpkg) { Remove-Item -Recurse -Force .tools\vcpkg }
            git clone https://github.com/microsoft/vcpkg .tools\vcpkg
          }
          Retry "Bootstrapping vcpkg" {
            .tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      # Done here as well as inside package.ps1, which hides CMake's configure output: if a
      # dependency fails to build, the reason is in this step's log.
      - name: Configure the SKSE plugin (vcpkg builds its dependencies here)
        working-directory: skse
        run: |
          cmake --preset default
          if ($LASTEXITCODE) { throw "CMake couldn't configure the SKSE plugin" }

      # Builds both halves and packs dist\ exactly as the author's release does.
      - name: Build and package
        run: |
          powershell -ExecutionPolicy Bypass -File tools\package.ps1
          if ($LASTEXITCODE) { throw "tools\package.ps1 failed" }

      - name: Check the controls switch and world reset made it into the build
        shell: bash
        run: |
          grep -aq "jumping by hand" skse/build/RelWithDebInfo/SkyCraft.dll || { echo "::error::SkyCraft.dll was built without the jump fallback."; exit 1; }
          if [ -f SkyCraft-Patch.patch ] || grep -q sToggleKey skse/src/Input.cpp; then
            grep -aq sToggleKey skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the controls switch." \
              || { echo "::error::SkyCraft.dll was built without the controls switch."; exit 1; }
          fi
          if [ -f SkyCraft-Patch.patch ] || grep -q sResetKey skse/src/Input.cpp; then
            grep -aq sResetKey skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the world reset key." \
              || { echo "::error::SkyCraft.dll was built without the world reset key."; exit 1; }
          fi
          if [ -f SkyCraft-Patch.patch ] || grep -q ApplyMobHit skse/src/Combat.cpp; then
            grep -aq "a Minecraft mob hit" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the mob-hit handling." \
              || { echo "::error::SkyCraft.dll was built without the mob-hit handling."; exit 1; }
          fi

      - name: Check the mob combat made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q kInSkyrimSwing skse/src/Combat.cpp; then
            grep -aq "Skyrim swing (kind" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode attacks." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode attacks."; exit 1; }
            grep -aq "Mob stand-ins will be made" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the mob stand-ins." \
              || { echo "::error::SkyCraft.dll was built without the mob stand-ins."; exit 1; }
          fi

      - name: Check the mob polish made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q DamageHealthExactly skse/src/Combat.cpp; then
            grep -aq "Sized a mob stand-in" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the stand-in sizing." \
              || { echo "::error::SkyCraft.dll was built without the mob polish."; exit 1; }
          fi

      - name: Check the mob hit effects, stand-in cleanup and settlement check made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q PlayMobImpact skse/src/Combat.cpp; then
            grep -aq "had no mob; put away" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the stand-in cleanup." \
              || { echo "::error::SkyCraft.dll was built without the stand-in cleanup."; exit 1; }
            grep -aq "a place people live" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the settlement check." \
              || { echo "::error::SkyCraft.dll was built without the settlement check."; exit 1; }
          fi

      - name: Check the Skyrim-mode block collision made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q BlockMove skse/src/NpcBlocks.cpp; then
            grep -aq "Skyrim control: Minecraft block collision" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode block collision." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode block collision."; exit 1; }
          fi

      - name: Check the block-edge and jump fixes made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q SupportPlanes skse/src/DigPhysics.cpp; then
            grep -aq "Skyrim control: jump height" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode jump height." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode jump height."; exit 1; }
          fi

      - name: Check the stand-in warm-up made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q mirrorOffFor skse/src/Combat.cpp; then
            grep -aq "warming up out of sight" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the stand-in warm-up." \
              || { echo "::error::SkyCraft.dll was built without the stand-in warm-up."; exit 1; }
          fi

      - name: Check the stand-in lock-on and health fixes made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q StandInDamageGuard skse/src/Combat.cpp; then
            grep -aq "Stand-in damage guard installed" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the stand-in damage guard." \
              || { echo "::error::SkyCraft.dll was built without the stand-in damage guard."; exit 1; }
            grep -aq "put on the mob's body and eyes" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the lock-on node placement." \
              || { echo "::error::SkyCraft.dll was built without the lock-on node placement."; exit 1; }
          fi

      - name: Check the Skyrim-mode landing fix made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q airHeld skse/src/NpcBlocks.cpp; then
            grep -aq "landed on a block by hand" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode landing fix." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode landing fix."; exit 1; }
          fi

      - name: Check the block-resting support fix made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q SetSkyrimPlayerResting skse/src/Dig.h; then
            grep -aq "resting on a block: support plane added" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the block-resting support fix." \
              || { echo "::error::SkyCraft.dll was built without the block-resting support fix."; exit 1; }
          fi

      - name: Check the Skyrim-mode body-width collision made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q SkyrimPlayerHalfWidth skse/src/Dig.h; then
            grep -aq "blocks wide for Minecraft's block collision" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode body-width collision." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode body-width collision."; exit 1; }
          fi

      - name: Check the Skyrim-mode standing fix made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q kProbe skse/src/NpcBlocks.cpp; then
            grep -aq "held the player on the ground" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode standing fix." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode standing fix."; exit 1; }
            grep -aq "stopped the player's leftover speed" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode slide stop." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode slide stop."; exit 1; }
            grep -aq "back on the ground inside the physics step" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the in-step ground hold." \
              || { echo "::error::SkyCraft.dll was built without the in-step ground hold."; exit 1; }
            grep -aq "patch revision 18" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll is patch revision 18." \
              || { echo "::error::SkyCraft.dll was built without patch revision 18 (is the newest SkyCraft-Patch.patch in the repo?)."; exit 1; }
          fi

      - name: Check the ledge assist made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q BoostControllerJump skse/src/NpcBlocks.cpp; then
            grep -aq "ledge assist put the player up" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the Skyrim-mode ledge assist." \
              || { echo "::error::SkyCraft.dll was built without the Skyrim-mode ledge assist."; exit 1; }
          fi

      - name: Check the stand-in persistence made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q "switched off while its mob lives" skse/src/Combat.cpp; then
            grep -aq "had been switched off while its mob lives" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the stand-in persistence." \
              || { echo "::error::SkyCraft.dll was built without the stand-in persistence."; exit 1; }
          fi

      - name: Check the crate edge-contact filter made it into the build
        shell: bash
        run: |
          if [ -f SkyCraft-Patch.patch ] || grep -q DropCrateContact skse/src/DigPhysics.cpp; then
            grep -aq "crate side and edge contacts ignored" skse/build/RelWithDebInfo/SkyCraft.dll \
              && echo "SkyCraft.dll has the crate edge-contact filter." \
              || { echo "::error::SkyCraft.dll was built without the crate edge-contact filter."; exit 1; }
          fi

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: SkyCraft-for-Vortex
          path: |
            dist/SkyCraft-*.zip
            dist/skycraft-fabric-*.jar
          if-no-files-found: error
          retention-days: 30

  # True Directional Movement with virtual targets (see TrueDirectionalMovement-VirtualTargets.patch). Built from TDM's own
  # source, the way TDM's own workflow does it, and packed as a small mod that goes over TDM's DLL.
  tdm-patch:
    runs-on: windows-2022  # TDM's preset uses the "Visual Studio 17 2022" generator
    timeout-minutes: 90
    env:
      # TDM's source, and the revision of it the patch is made for. If TDM changes and the patch stops applying, put the
      # commit the patch was made for here (the job says so when it can't apply it).
      TDM_REPO: ersh1/TrueDirectionalMovement
      TDM_REF: master
      VCPKG_COMMIT_ID: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3  # the one TDM's own workflow uses

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - name: Check out SkyCraft (for the patch)
        uses: actions/checkout@v5
        with:
          path: skycraft

      - name: Look for TrueDirectionalMovement-VirtualTargets.patch
        id: have
        shell: bash
        run: |
          if [ -f skycraft/TrueDirectionalMovement-VirtualTargets.patch ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No TrueDirectionalMovement-VirtualTargets.patch in the repo; nothing to build."
          fi

      - name: Check out True Directional Movement (with its CommonLibSSE-NG submodule)
        if: steps.have.outputs.have == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TDM_REPO }}
          ref: ${{ env.TDM_REF }}
          path: tdm
          submodules: recursive

      - name: Apply the virtual targets patch
        if: steps.have.outputs.have == 'true'
        shell: bash
        working-directory: tdm
        run: |
          patch=../skycraft/TrueDirectionalMovement-VirtualTargets.patch
          if grep -q SetVirtualTargets src/DirectionalMovementHandler.cpp; then
            echo "TDM's source already has virtual targets; nothing to apply."
          elif git apply --check "$patch"; then
            git apply "$patch"
            echo "Applied the patch to TDM $(git rev-parse --short HEAD)."
          else
            echo "::error::TrueDirectionalMovement-VirtualTargets.patch doesn't apply to TDM $(git rev-parse --short HEAD). TDM has probably changed since the patch was made; set TDM_REF in the workflow to the commit it was made for, or have the patch redone."
            exit 1
          fi

      - name: Set up vcpkg (installs no packages itself)
        if: steps.have.outputs.have == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/b/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          vcpkgJsonGlob: tdm/vcpkg.json

      # TDM's preset turns every warning into an error (/WX); here they stay warnings, so a harmless one can't stop the build.
      - name: Configure True Directional Movement
        if: steps.have.outputs.have == 'true'
        working-directory: tdm
        shell: pwsh
        run: |
          cmake --preset github-actions "-DCMAKE_CXX_FLAGS=/EHsc /MP /W4"
          if ($LASTEXITCODE) { throw "CMake couldn't configure True Directional Movement" }

      - name: Build True Directional Movement
        if: steps.have.outputs.have == 'true'
        working-directory: tdm
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE) { throw "True Directional Movement didn't build" }

      - name: Pack the mod
        if: steps.have.outputs.have == 'true'
        shell: pwsh
        run: |
          $dll = "tdm\build\src\Release\TrueDirectionalMovement.dll"
          if (-not (Test-Path $dll)) { throw "$dll wasn't built" }
          $stage = "tdm-pack"
          New-Item -ItemType Directory -Force "$stage\SKSE\Plugins" | Out-Null
          Copy-Item $dll "$stage\SKSE\Plugins\TrueDirectionalMovement.dll"
          Copy-Item tdm\COPYING "$stage\COPYING"
          Copy-Item tdm\EXCEPTIONS "$stage\EXCEPTIONS"
          Copy-Item skycraft\TrueDirectionalMovement-VirtualTargets.patch "$stage\TrueDirectionalMovement-VirtualTargets.patch"
          @"
          True Directional Movement with virtual targets (for SkyCraft)

          Install over True Directional Movement (it needs TDM's other files); this DLL replaces TDM's.
          It is TDM $(git -C tdm rev-parse --short HEAD) with TrueDirectionalMovement-VirtualTargets.patch applied, which lets a mod hand
          TDM things to lock on to that aren't actors (SkyCraft hands it Minecraft's mobs). Nothing else changes.
          True Directional Movement is by Ersh, GPL-3.0 with its modding exception (COPYING, EXCEPTIONS). The source is
          https://github.com/ersh1/TrueDirectionalMovement plus the patch included here.
          "@ | Set-Content "$stage\README.txt"
          New-Item -ItemType Directory -Force dist-tdm | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist-tdm\SkyCraft-TDM-VirtualTargets-patch.zip"

      - name: Upload the patch mod
        if: steps.have.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SkyCraft-TDM-VirtualTargets-patch
          path: dist-tdm/SkyCraft-TDM-VirtualTargets-patch.zip
          if-no-files-found: error
          retention-days: 30
